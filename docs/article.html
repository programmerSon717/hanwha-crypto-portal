<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>리서치 상세 · 한화 크립토 포탈</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>🪙</text></svg>">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="assets/css/portal.css">
</head>
<body>
<main class="container page">
  <div class="article-wrap">
    <article class="article" id="art"><div class="skeleton" style="height:520px"></div></article>
    <aside id="side"></aside>
  </div>
  <section id="rel"></section>
</main>

<script type="module">
import { mountChrome, load, esc, initials, thumb, cardHTML, qs, BASE, pct, fmtPrice } from './assets/js/portal.js';
import { fetchMarket } from './assets/js/market.js';

mountChrome('research.html');

const id = qs('id'), ym = qs('ym');
const art = document.getElementById('art');

let a;
try { a = (await load(`articles/${ym}.json`))[id]; } catch { a = null; }
if (!a) {
  art.innerHTML = '<p class="empty">글을 찾을 수 없습니다. <a href="latest.html" style="color:var(--brand)">최신정보로 돌아가기</a></p>';
} else {
  document.title = `${a.headline} · 한화 크립토 포탈`;

  art.innerHTML = `
    <h1>${esc(a.emoji)} ${esc(a.headline)}</h1>
    <div class="article-hd">
      <span class="avatar" style="width:40px;height:40px;font-size:13px;background:${esc(a.color)}">HW</span>
      <span class="author" style="flex-direction:column;align-items:flex-start;gap:1px">
        한화 크립토 뉴스봇<span class="sub">Hanwha Digital Asset</span></span>
      <span class="acts">
        <button id="share" title="링크 복사">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/>
            <path d="M8.6 13.5l6.8 4M15.4 6.5l-6.8 4"/></svg></button>
        <button id="print" title="인쇄">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M6 9V3h12v6M6 18H4v-6h16v6h-2M8 14h8v7H8z"/></svg></button>
      </span>
    </div>
    <div class="article-date">${esc(a.datetime)}</div>

    <div class="hero" style="margin-bottom:34px">${thumb(
      { g: a.group, cl: a.category_label, date: a.date }, 'HANWHA BRIEF')}</div>

    <div class="article-body">
      <h2>시황 코멘트</h2>
      <p>${esc(a.lede)}</p>

      <h2>${esc(a.section_title)}</h2>
      <div class="kv-box"><ul>${a.bullets.map(b => `<li>${esc(b)}</li>`).join('')}</ul></div>

      ${a.quotes.length ? `<h2>원문 인용</h2>${a.quotes.map(q =>
        `<div class="quote-box">${esc(q)}</div>`).join('')}` : ''}

      <h2>봇 코멘트</h2>
      <div class="penguin"><span class="ico">🐧</span><p>${esc(a.comment)}</p></div>

      ${a.source_url ? `<p style="margin-top:30px">
        <a href="${esc(a.source_url)}" target="_blank" rel="noopener"
           style="color:var(--brand);font-weight:600">기사 원문 보기 ↗</a>
        ${a.source_name ? `<span style="color:var(--ink-4)"> · ${esc(a.source_name)}</span>` : ''}</p>` : ''}

      <div class="disclaimer">
        <h4>주의사항</h4>
        <p>본 글은 한화 크립토 뉴스봇이 공개된 기사·공지를 요약·정리한 자료입니다. 작성 주체는 자동화된 요약
           시스템이며, 한화의 공식 입장이나 의견을 대변하지 않습니다. 본 글은 정보 제공을 목적으로 배포되는
           자료로, 투자 자문이나 투자권유에 해당하지 않습니다. 투자 결정과 그 책임은 이용자 본인에게 있습니다.</p>
        <p>요약 과정에서 원문의 뉘앙스가 달라질 수 있으므로, 중요한 판단에는 반드시 기사 원문을 함께 확인하시기 바랍니다.</p>
      </div>
    </div>`;

  document.getElementById('share').onclick = async () => {
    await navigator.clipboard.writeText(location.href);
    const b = document.getElementById('share');
    b.style.color = 'var(--brand)';
    setTimeout(() => b.style.color = '', 1200);
  };
  document.getElementById('print').onclick = () => print();

  document.getElementById('side').innerHTML = `
    <div class="aside-sec"><label>리서치 분류</label>
      <div class="val">${esc(a.group)} <span class="sep">›</span> ${esc(a.category_label)}</div></div>
    <div class="aside-sec"><label>리서치 유형</label>
      <div class="val">한화 오리지널</div></div>
    <div class="aside-sec"><label>리서치 태그</label>
      <div class="val">${a.tags.map(t => `<a class="chip" href="${BASE}latest.html?q=${encodeURIComponent(t)}">${esc(t)}</a>`).join('')}</div></div>
    ${a.symbol ? `<div class="aside-sec"><label>관련 가상자산 시세</label>
      <div class="price-card" id="pc">
        <div class="top"><span class="coin" style="background:${esc(a.asset_color)}">${esc(a.symbol.slice(0, 4))}</span>
          <b>${esc(a.asset)}</b></div>
        <div class="skeleton" style="height:60px"></div>
      </div></div>` : ''}`;

  if (a.symbol) {
    try {
      const rows = await fetchMarket('korea');
      const r = rows.find(x => x.sym === a.symbol);
      const pc = document.getElementById('pc');
      pc.innerHTML = r ? `
        <div class="top"><span class="coin" style="background:${esc(a.asset_color)}">${esc(a.symbol.slice(0, 4))}</span>
          <b>${esc(r.name)}</b> ${pct(r.chg24)}</div>
        <div style="font-size:21px;font-weight:800;font-variant-numeric:tabular-nums">₩ ${fmtPrice(r.price)}</div>
        <div style="display:flex;gap:14px;margin-top:12px;font-size:13px;color:var(--ink-3)">
          <span>1H ${pct(r.chg1)}</span><span>7D ${pct(r.chg7)}</span></div>
        <a href="${BASE}market.html?q=${encodeURIComponent(a.symbol)}"
           style="display:inline-block;margin-top:14px;font-size:13.5px;color:var(--brand);font-weight:600">시장동향에서 보기 →</a>`
        : '<p style="font-size:13.5px;color:var(--ink-4);margin:0">시세 정보가 없습니다.</p>';
    } catch {}
  }

  /* 연관: 같은 분류의 최근 글 */
  const items = await load('items-recent.json');
  const rel = items.filter(i => i.c === a.category && i.id !== a.id).slice(0, 4);
  if (rel.length) document.getElementById('rel').innerHTML =
    `<h2 class="rel-head">연관 리서치</h2><div class="grid4">${rel.map(cardHTML).join('')}</div>`;
}
</script>
</body>
</html>
