<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>한화 크립토 포탈</title>
<meta name="description" content="한화 크립토 뉴스봇이 발행한 리서치·최신정보·시장동향을 한 화면에서 봅니다.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>🪙</text></svg>">
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="assets/css/portal.css">
</head>
<body>
<main class="container page">
  <div class="home">
    <section class="home-col">
      <h2 class="sec-title"><a href="research.html">리서치</a> <span class="arrow">→</span></h2>
      <div id="hero"><div class="skeleton" style="aspect-ratio:16/10"></div></div>
      <div class="dots" id="dots"></div>
      <div class="mini3" id="mini"></div>
      <div class="weekly-box" id="weekly"></div>
    </section>

    <section class="home-col">
      <h2 class="sec-title"><a href="latest.html">최신정보</a> <span class="arrow">→</span></h2>
      <div class="cal" id="cal"></div>
      <div class="feed" id="dayFeed"></div>
      <h3 class="subhead">많이 본 최신정보</h3>
      <div class="feed" id="topFeed"></div>
    </section>

    <section class="home-col third">
      <h2 class="sec-title"><a href="market.html">자산시세</a> <span class="arrow">→</span></h2>
      <div class="searchbox" style="height:42px;margin-bottom:12px">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#9A9AA5" stroke-width="2">
          <circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <input id="tickerQ" placeholder="가상자산명/심볼명" aria-label="자산 검색">
      </div>
      <div class="ticker-hd"><span>자산</span><span>24h 거래량</span></div>
      <div class="ticker scroll-y" id="ticker"></div>
    </section>
  </div>
</main>

<script type="module">
import { mountChrome, load, esc, cardHTML, thumb, gradient, initials,
         fmtKRW, fmtPrice, pct, BASE } from './assets/js/portal.js';
import { fetchMarket } from './assets/js/market.js';

mountChrome('index.html');

const [items, research] = await Promise.all([
  load('items-recent.json'), load('research.json'),
]);

/* ── 리서치 캐러셀 ───────────────────────────────── */
const heroPool = items.filter(i => i.nb >= 4).slice(0, 5);
let hi = 0;
const hero = document.getElementById('hero'), dots = document.getElementById('dots');

function drawHero() {
  const it = heroPool[hi];
  hero.innerHTML = `<div class="hero">
    <a href="article.html?id=${it.id}&ym=${it.ym}">${thumb(it, 'HANWHA RESEARCH')}</a>
    <div class="hero-cap">
      <h3>${esc(it.t)}</h3>
      <span class="author">
        <span class="avatar" style="background:${esc(it.ac)}">${esc(initials(it.as, it.an))}</span>
        ${esc(it.an)}</span>
    </div>
    <button class="hero-nav prev" aria-label="이전">‹</button>
    <button class="hero-nav next" aria-label="다음">›</button>
  </div>`;
  hero.querySelector('.prev').onclick = () => { hi = (hi - 1 + heroPool.length) % heroPool.length; drawHero(); };
  hero.querySelector('.next').onclick = () => { hi = (hi + 1) % heroPool.length; drawHero(); };
  dots.innerHTML = heroPool.map((_, i) =>
    `<button data-i="${i}" ${i === hi ? 'aria-current="true"' : ''} aria-label="${i + 1}번"></button>`).join('');
  dots.querySelectorAll('button').forEach(b => b.onclick = () => { hi = +b.dataset.i; drawHero(); });
}
drawHero();
setInterval(() => { hi = (hi + 1) % heroPool.length; drawHero(); }, 7000);

document.getElementById('mini').innerHTML = items.filter(i => i.nb >= 3)
  .slice(5, 8).map(it => `<a href="article.html?id=${it.id}&ym=${it.ym}">
    ${thumb(it)}<p>${esc(it.t)}</p></a>`).join('');

const wk = research[0];
document.getElementById('weekly').innerHTML = wk
  ? `<h4>Weekly Hanwha</h4><div class="date">${esc(wk.date)}</div>
     <a href="report.html?slug=${esc(wk.slug)}"><p>${esc(wk.title)}</p></a>`
  : '';

/* ── 캘린더 + 당일 피드 ──────────────────────────── */
const byDay = new Map();
for (const it of items) {
  const k = new Date(it.ts * 1000).toISOString().slice(0, 10);
  (byDay.get(k) || byDay.set(k, []).get(k)).push(it);
}
const newest = new Date(items[0].ts * 1000);
let view = new Date(newest.getFullYear(), newest.getMonth(), 1);
let pick = newest.toISOString().slice(0, 10);

function drawCal() {
  const y = view.getFullYear(), m = view.getMonth();
  const first = new Date(y, m, 1), days = new Date(y, m + 1, 0).getDate();
  const cells = [];
  for (let i = 0; i < first.getDay(); i++) cells.push(null);
  for (let d = 1; d <= days; d++) cells.push(new Date(y, m, d));
  const dow = ['일', '월', '화', '수', '목', '금', '토'];

  document.getElementById('cal').innerHTML = `
    <div class="cal-hd"><b>${y}년 ${m + 1}월</b>
      <span class="cal-today">오늘</span>
      <span class="cal-nav"><button data-s="-1">‹</button><button data-s="1">›</button></span>
    </div>
    <div class="cal-grid">
      ${dow.map((d, i) => `<span class="dow ${i === 0 ? 'sun' : i === 6 ? 'sat' : ''}">${d}</span>`).join('')}
      ${cells.map(d => {
        if (!d) return '<span></span>';
        const k = new Date(d.getTime() - d.getTimezoneOffset() * 6e4).toISOString().slice(0, 10);
        const list = byDay.get(k) || [];
        const marks = list.slice(0, 2).map(i =>
          `<i style="background:${esc(i.ac)}">${esc(initials(i.as, i.an).slice(0, 1))}</i>`).join('');
        const more = list.length > 2 ? `<span class="more">+${list.length - 2}</span>` : '';
        return `<button class="cal-cell ${k === pick ? 'on' : ''} ${list.length ? '' : 'off'}" data-k="${k}">
          <span class="d">${d.getDate()}</span>
          <span class="marks">${marks}${more}</span></button>`;
      }).join('')}
    </div>`;
  document.querySelectorAll('.cal-nav button').forEach(b => b.onclick = () => {
    view = new Date(view.getFullYear(), view.getMonth() + Number(b.dataset.s), 1); drawCal();
  });
  document.querySelectorAll('.cal-cell').forEach(b => b.onclick = () => {
    pick = b.dataset.k; drawCal(); drawDay();
  });
}

const feedRow = it => `<a class="feed-row" href="article.html?id=${it.id}&ym=${it.ym}">
  <span class="feed-kind">${it.as ? '토큰' : '이슈'}</span>
  <span>
    <h4>${esc(it.t)}</h4>
    <span class="feed-sub">
      <span class="feed-asset"><span class="coin" style="background:${esc(it.ac)}">${esc(initials(it.as, it.an))}</span>${esc(it.an)}</span>
      <span class="chip">${esc(it.cl)}</span>
      <span class="date">${esc(it.date)}</span>
    </span>
  </span></a>`;

function drawDay() {
  const list = (byDay.get(pick) || []).slice(0, 6);
  document.getElementById('dayFeed').innerHTML = list.length
    ? list.map(feedRow).join('')
    : '<p class="empty" style="padding:28px 0">해당 날짜에 발행된 정보가 없습니다.</p>';
}
drawCal(); drawDay();

document.getElementById('topFeed').innerHTML =
  [...items].sort((a, b) => b.nb - a.nb || b.ts - a.ts).slice(0, 12).map(feedRow).join('');

/* ── 자산시세 ───────────────────────────────────── */
const tickerEl = document.getElementById('ticker');
tickerEl.innerHTML = '<div class="skeleton" style="height:420px"></div>';
let rows = [];
function drawTicker() {
  const q = document.getElementById('tickerQ').value.trim().toLowerCase();
  const f = rows.filter(r => !q || r.name.toLowerCase().includes(q) || r.sym.toLowerCase().includes(q));
  tickerEl.innerHTML = f.length ? f.slice(0, 40).map(r => `
    <a class="ticker-row" href="market.html?q=${encodeURIComponent(r.sym)}">
      <span>
        <span class="ticker-name"><span class="coin" style="background:${esc(r.color)}">${esc(r.sym.slice(0, 4))}</span>
          ${esc(r.name)}${r.name === r.sym ? '' : ` <span class="sym">${esc(r.sym)}</span>`}</span>
        <span class="ticker-price">₩ ${fmtPrice(r.price)} ${pct(r.chg24)}</span>
      </span>
      <span class="ticker-vol">₩ ${fmtKRW(r.vol24)}</span>
    </a>`).join('') : '<p class="empty">일치하는 자산이 없습니다.</p>';
}
document.getElementById('tickerQ').oninput = drawTicker;
try { rows = await fetchMarket('korea'); drawTicker(); }
catch { tickerEl.innerHTML = '<p class="empty">시세를 불러오지 못했습니다.</p>'; }
</script>
</body>
</html>
