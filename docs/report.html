<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Weekly Hanwha · 한화 크립토 포탈</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>🪙</text></svg>">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="assets/css/portal.css">
</head>
<body>
<main class="container page">
  <div class="article-wrap">
    <article class="article" id="art"><div class="skeleton" style="height:520px"></div></article>
    <aside id="side"></aside>
  </div>
</main>

<script type="module">
import { mountChrome, load, esc, qs, BASE, gradient, fmtInt } from './assets/js/portal.js';

mountChrome('research.html');
const slug = qs('slug');
const art = document.getElementById('art');

let r;
try { r = await load(`research/${slug}.json`); } catch { r = null; }
if (!r) {
  art.innerHTML = '<p class="empty">리포트를 찾을 수 없습니다. <a href="research.html" style="color:var(--brand)">리서치로 돌아가기</a></p>';
} else {
  document.title = `${r.title} · 한화 크립토 포탈`;
  const max = Math.max(...r.by_category.map(([, n]) => n), 1);

  art.innerHTML = `
    <h1>${esc(r.title)}</h1>
    <div class="article-hd">
      <span class="avatar" style="width:40px;height:40px;font-size:13px;background:#F37321">HW</span>
      <span class="author" style="flex-direction:column;align-items:flex-start;gap:1px">
        ${esc(r.author)}<span class="sub">Hanwha Digital Asset</span></span>
    </div>
    <div class="article-date">${esc(r.range)} · 수집 ${fmtInt(r.total)}건</div>

    <div class="hero" style="margin-bottom:34px">
      <div class="thumb" style="${gradient('마켓')};aspect-ratio:16/8">
        <span class="badge-orig">Hanwha Original</span>
        <span class="thumb-k">${esc(r.week)}</span>
        <span class="thumb-t" style="font-size:36px">Weekly Hanwha</span>
        <span class="thumb-s">${esc(r.range)}</span>
        <span class="thumb-brand">Hanwha <i>CRYPTO</i></span>
      </div>
    </div>

    <div class="article-body">
      <h2>이번 주 요약</h2>
      <p>${esc(r.range)} 기간 동안 한화 크립토 뉴스봇은 총 <b>${fmtInt(r.total)}건</b>을 발행했습니다.
         영역별로는 ${r.by_group.map(([g, n]) => `${esc(g)} ${fmtInt(n)}건`).join(', ')} 순이었습니다.
         아래는 그 중 내용이 두꺼운 순으로 추린 주요 소식입니다.</p>

      <h2>분류별 발행 분포</h2>
      <div class="kv-box">
        ${r.by_category.map(([label, n]) => `
          <div style="display:grid;grid-template-columns:120px 1fr 56px;align-items:center;gap:12px;margin-bottom:10px">
            <span style="font-size:14px;font-weight:600">${esc(label)}</span>
            <span style="height:10px;background:var(--surface-2);border-radius:5px;overflow:hidden">
              <span style="display:block;height:100%;width:${(n / max * 100).toFixed(1)}%;background:var(--brand);border-radius:5px"></span>
            </span>
            <span style="font-size:13.5px;text-align:right;font-variant-numeric:tabular-nums;color:var(--ink-3)">${fmtInt(n)}건</span>
          </div>`).join('')}
      </div>

      ${r.top_assets.length ? `<h2>많이 언급된 가상자산</h2>
      <div class="kv-box"><div style="display:flex;gap:8px;flex-wrap:wrap">
        ${r.top_assets.map(([a, n]) => `<span class="chip">${esc(a)} · ${fmtInt(n)}</span>`).join('')}
      </div></div>` : ''}

      <h2>주간 주요 소식</h2>
      <div class="kv-box" style="padding:0;overflow:hidden">
        <table class="tbl tbl-dark" style="margin:0">
          <thead><tr><th>요약</th><th style="width:150px">분류</th><th style="width:110px" class="num">작성일</th></tr></thead>
          <tbody>${r.highlights.map(h => `
            <tr onclick="location.href='${BASE}article.html?id=${h.id}&ym=${h.ym}'" style="cursor:pointer">
              <td><span class="tbl-title">${esc(h.title)}</span></td>
              <td><span class="chip">${esc(h.cl)}</span></td>
              <td class="num"><span class="date">${esc(h.date)}</span></td>
            </tr>`).join('')}</tbody>
        </table>
      </div>

      ${r.highlights.slice(0, 5).map(h => `
        <h2>${esc(h.title)}</h2>
        <p>${esc(h.lede)}</p>
        ${h.bullets.length ? `<div class="kv-box"><ul>${h.bullets.map(b => `<li>${esc(b)}</li>`).join('')}</ul></div>` : ''}
        <p><a href="${BASE}article.html?id=${h.id}&ym=${h.ym}" style="color:var(--brand);font-weight:600">자세히 보기 →</a></p>`).join('')}

      <div class="disclaimer">
        <h4>주의사항</h4>
        <p>본 리포트는 한화 크립토 뉴스봇의 발행 이력을 기계적으로 집계해 만든 자료입니다.
           새로 작성된 전망이나 의견은 포함되어 있지 않으며, 각 항목의 출처는 개별 글에서 확인할 수 있습니다.</p>
        <p>본 자료는 정보 제공 목적이며 투자 자문이나 투자권유에 해당하지 않습니다.</p>
      </div>
    </div>`;

  document.getElementById('side').innerHTML = `
    <div class="aside-sec"><label>리서치 분류</label>
      <div class="val">정기간행물 <span class="sep">›</span> 주간 브리핑</div></div>
    <div class="aside-sec"><label>리서치 유형</label><div class="val">한화 오리지널</div></div>
    <div class="aside-sec"><label>대상 기간</label><div class="val">${esc(r.range)}</div></div>
    <div class="aside-sec"><label>리서치 태그</label>
      <div class="val">${r.tags.map(t => `<span class="chip">${esc(t)}</span>`).join('')}</div></div>`;
}
</script>
</body>
</html>
